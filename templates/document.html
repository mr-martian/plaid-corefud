<!doctype html>
<html>
  <head>
    <meta charset="utf-8"/>
    <title>{{document['document/name']}}</title>
    <style>
      div.sentence-data {
	        display: grid;
	        grid-auto-flow: column;
	        gap: 5px;
      }
      .word {
	        text-align: center;
	        border-radius: 7px;
      }
      .word:hover {
	        background-color: #BBBBBB;
      }
      .word.selected {
	        border: 3px solid blue;
      }
      .coref-span {
	        text-align: center;
	        background: #AAAAAA;
	        border-radius: 7px;
      }
      .coref-span.selected {
	        border: 3px solid blue;
      }
      .controls {
          position: sticky;
          left: 10px;
          display: inline-block;
      }
      .sentence {
          width: fit-content;
      }
    </style>
  </head>
  <body>
    <h1>{{document['document/name']}}</h1>
    <p><a href="/project/{{document['document/project']}}">Return to project</a></p>
    <label for="text-direction">RTL text</label>
    <input type="checkbox" id="text-direction" onchange="draw_trees();"></input>
    {% for sent in sentences %}
    <h2>Sentence {{sent.index}}: {{sent.metadata.text}}</h2>
    <div class="sentence" data-sent="{{sent|tojson|forceescape}}">
      <details>
	      <summary>Metadata</summary>
	      <dl class="sentence-metadata"></dl>
      </details>
      <svg class="tree"></svg>
      <div class="sentence-data"></div>
      <div class="controls">
	      <button class="btn-add" title="a" disabled>Add Mention</button>
	      <button class="btn-del" title="d" disabled>Delete Mention</button>
	      <button class="btn-shift" title="s" disabled>Shift Mention</button>
	      <button class="btn-change" title="e" disabled>Change Entity</button>
	      <button class="btn-rename" title="r" disabled>Rename Entity</button>
      </div>
    </div>
    {% endfor %}
    <script type="text/javascript">
      var COREF_SPANS = {{coref['span-layer/spans']|tojson|safe}};
      var MENTIONS = {{mentions['relation-layer/relations']|tojson|safe}};
      const LAYER_ID = "{{coref['span-layer/id']}}";
      const RELATION_LAYER_ID = "{{mentions['relation-layer/id']}}";
      const DOCUMENT_ID = "{{document['document/id']}}";
      const ALL_TOKENS = {{all_tokens|tojson|safe}};
    </script>
    <dialog id="dialog">
      <form method="dialog">
        <input id="dialog-mode" type="hidden"></input>
        <label for="existing-entity">Existing Entity</label>
        <select id="existing-entity">
        </select>
        <br/>
        <label for="entity-name">New Entity</label>
        <input id="entity-name"></input>
        <select id="entity-type">
	        <option value="person">person</option>
          <option value="time">time</option>
          <option value="object">object</option>
          <option value="place">place</option>
          <option value="organization">organization</option>
          <option value="abstract">abstract</option>
          <option value="animal">animal</option>
          <option value="plant">plant</option>
          <option value="event">event</option>
          <option value="substance">substance</option>
	      </select>
        <br/>
        <button value="cancel" formmethod="dialog">Cancel</button>
        <button value="confirm" formmethod="dialog">Confirm</button>
      </form>
      <p style="height: 5em"/>
    </dialog>
    <script type="text/javascript" src="/static/draw-trees.js"></script>
    <script type="text/javascript" src="/static/chosen-assets-v3.1.4/chosen.min.js"></script>
    <link rel="stylesheet" href="/static/chosen-assets-v3.1.4/chosen.min.css"/>
    <script type="text/javascript">
      window.addEventListener('load', () => {
          document.getElementById('existing-entity').chosen();
          document.getElementById('entity-type').chosen();
      });
    </script>
  </body>
</html>
